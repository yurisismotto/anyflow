# CI-007 — the release artifact pipeline.
#
# What this produces, and from what
# ---------------------------------
# Every Linux artifact OmniBridge ships, built from **one immutable git
# revision**, in network-isolated builds, by a machine that is not a
# developer's workstation:
#
#   omnibridge-<V>.tar.gz              the upstream source
#   omnibridge-<V>-vendor.tar.xz       every crate in desktop/Cargo.lock
#   omnibridge-<V>-*.src.rpm           the source package
#   omnibridge-<V>-*.x86_64.rpm        Fedora 44, core + gui
#   omnibridge_<V>-*_amd64.deb         Ubuntu 24.04, Ubuntu 26.04, Debian 13
#   omnibridge-<V>-sbom.cdx.json       CycloneDX SBOM from the locked graph
#   SHA256SUMS                         over all of the above
#   (attestation)                      GitHub build provenance, Sigstore-backed
#
# The immutable input is the point
# --------------------------------
# `make-source-bundle.sh` has two modes and only one of them is a release
# path. `--worktree` bundles whatever is lying in a checkout, including
# uncommitted and untracked files; it exists to validate a packaging change
# before it is committed and its own output says so. This workflow always
# passes `--rev`, and always a resolved **commit SHA** rather than a branch
# name, because a branch moves and a SHA does not.
#
# No tag is required for that and none is created here. `v0.1.0` does not
# exist yet, and publishing a release is a deliberate act that belongs to a
# human — this pipeline proves the artifacts can be produced, not that they
# should be published.
#
# Signing: the path exists, the key does not
# ------------------------------------------
# `SHA256SUMS` is signed **if and only if** the `RELEASE_SIGNING_KEY` secret is
# configured. Until somebody decides how the production key is custodied, it is
# not, and the run says so in its summary rather than quietly skipping. The
# wiring is here so that the decision is the only thing left to make: adding
# the secret turns signing on with no workflow edit.
#
# The signing step never prints the key, never writes it into the release
# directory, and asserts both of those after it runs. The scripts it calls
# carry the reasoning: packaging/release/{sign,verify}-release.sh, with the
# negative tests in packaging/tests/release-signing-tests.sh.
#
# The trust model and the open decision are in
# docs/audits/release/RELEASE-SIGNING-FOUNDATION-V1.md.
#
# What IS attested: `actions/attest-build-provenance` records what was built,
# from which commit, by which workflow, backed by Sigstore and GitHub's OIDC
# identity. It needs no secret of ours — that is precisely why it is usable
# here and why it is not a substitute for a maintainer's own signature.

name: Release · Linux artifacts

on:
  # The normal way to run this before a release exists.
  workflow_dispatch:
    inputs:
      rev:
        description: 'Commit SHA or tag to build from (default: the checked-out SHA)'
        required: false
        type: string
  # The release path, for when a tag eventually exists. Building on the tag is
  # what makes the artifacts correspond to something immutable and public.
  push:
    tags:
      - 'v*'
  # And the pipeline exercises itself whenever its own tooling changes. Not on
  # every packaging PR: this runs four container builds each executing the full
  # test suite, and spending forty minutes of CI to re-prove an unchanged
  # pipeline is how a useful gate becomes one people route around. It runs when
  # the thing that could break it is what moved.
  pull_request:
    branches: [main, develop]
    paths:
      - 'packaging/release/**'
      - 'packaging/fedora/build-rpm.sh'
      - 'packaging/fedora/omnibridge.spec'
      - 'packaging/debian/build-deb.sh'
      - 'packaging/debian/rules'
      - 'packaging/debian/control'
      - '.github/workflows/release-artifacts.yml'

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1 -----
  # The bundle every other job consumes. Built once, so all six package
  # artifacts are demonstrably from the same source bytes.
  bundle:
    name: Source bundle · from an immutable rev
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Full history: `--rev` has to be able to resolve a SHA that is not HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the revision, and refuse a moving one
        id: resolve
        run: |
          requested="${{ inputs.rev }}"
          [ -n "$requested" ] || requested="${{ github.sha }}"
          rev="$(git rev-parse --verify "${requested}^{commit}")"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

          version="$(awk '
            /^\[workspace\.package\]/ { s=1; next } /^\[/ { s=0 }
            s && /^[[:space:]]*version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/,""); print; exit }
          ' desktop/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "requested : $requested"
          echo "resolved  : $rev"
          echo "version   : $version"
          # A SHA is immutable; a branch name is not. Everything downstream is
          # built from the resolved value, never from what was typed.
          case "$rev" in
            [0-9a-f]*) ;;
            *) echo "::error::'$requested' did not resolve to a commit SHA"; exit 1 ;;
          esac

      - name: Rust toolchain, pinned to the MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version

      # The bundle script checks the lockfile with `cargo metadata --locked
      # --offline` before it does anything else, which needs the crates to be
      # in the local cargo cache already. On a developer's machine they are; on
      # a fresh runner they are not, and the check fails with "no matching
      # package named `prost`" — a confusing way to say "nothing is cached".
      #
      # Fetching first is the right fix rather than dropping `--offline` from
      # the script: that flag is what makes the check prove the vendored build
      # will resolve, and weakening it to make CI green would remove the
      # guarantee the check exists for.
      - name: Populate the cargo cache
        working-directory: desktop
        run: cargo fetch --locked

      # `cargo vendor` needs the network; nothing after this job does.
      - name: Build the bundle
        run: |
          ./packaging/release/make-source-bundle.sh \
            --rev "${{ steps.resolve.outputs.rev }}" \
            --output dist

      - name: The bundle is what the packaging expects
        run: ./packaging/tests/packaging-checks.sh --bundle dist

      - uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------- 2 -----
  rpm:
    name: Fedora 44 · RPM
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-bundle
          path: dist

      # The build itself runs with --network=none inside the script; podman is
      # preinstalled on the GitHub Ubuntu images.
      - name: Build
        run: ./packaging/fedora/build-rpm.sh dist --output out

      - name: Inspect the built packages
        run: |
          # Named precisely rather than globbed: `omnibridge-*.x86_64.rpm`
          # matches the gui package too, and the second path would arrive as an
          # unrecognised argument.
          core="$(find out -name 'omnibridge-[0-9]*.x86_64.rpm')"
          gui="$(find out -name 'omnibridge-gui-*.x86_64.rpm')"
          test -n "$core" || { echo "::error::no core RPM was produced"; exit 1; }
          test -n "$gui"  || { echo "::error::no gui RPM was produced";  exit 1; }
          ./packaging/tests/packaging-checks.sh --rpm "$core" --rpm "$gui"
          echo '--- rpmlint ---'; cat out/rpmlint.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora44
          path: out/*.rpm
          if-no-files-found: error

  # ---------------------------------------------------------------- 3 -----
  deb:
    name: ${{ matrix.label }} · DEB
    needs: bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/library/ubuntu:24.04
            label: Ubuntu 24.04 LTS
            slug: ubuntu2404
          - image: docker.io/library/ubuntu:26.04
            label: Ubuntu 26.04 LTS
            slug: ubuntu2604
          - image: docker.io/library/debian:trixie
            label: Debian 13 trixie
            slug: debian13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-bundle
          path: dist

      - name: Build
        run: ./packaging/debian/build-deb.sh --image ${{ matrix.image }} dist --output out

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.slug }}
          path: |
            out/*.deb
            out/lintian.txt
          if-no-files-found: error

  # ---------------------------------------------------------------- 4 -----
  sbom:
    name: SBOM · CycloneDX
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bundle.outputs.rev }}

      - name: Rust toolchain, pinned to the MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      # One SBOM per shipped binary rather than a single roll-up. That is what
      # `--describe binaries` produces, and it is the more useful shape: a
      # consumer asking "what is in omnibridged" gets the daemon's closure
      # without the GUI's GTK stack in it.
      #
      # MEASURED locally before this was written: `cargo cyclonedx` rejects
      # `--locked` — the flag does not exist on it. The lockfile is still what
      # is described, because the checkout is at the release revision and
      # cargo-cyclonedx reads the resolved graph from `Cargo.lock`.
      - name: Generate
        run: |
          mkdir -p out
          ( cd desktop && cargo cyclonedx --format json --describe binaries )
          found=$(find desktop -name '*.cdx.json' -not -path 'desktop/target/*' | wc -l)
          if [ "$found" -eq 0 ]; then
            echo "::error::cargo-cyclonedx produced no SBOM"
            exit 1
          fi
          echo "cargo-cyclonedx wrote $found SBOM(s)"
          for f in $(find desktop -name '*.cdx.json' -not -path 'desktop/target/*'); do
            base="$(basename "$f" .cdx.json)"
            cp "$f" "out/omnibridge-${{ needs.bundle.outputs.version }}-$base.cdx.json"
          done
          ls -l out/

      # An SBOM that parses and names the dependency the security
      # certification fixed. A file of the right shape containing nothing is
      # the failure mode worth guarding here.
      - name: The SBOM describes the graph that actually shipped
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob('out/*.cdx.json'))
          assert files, "no SBOM to check"
          ok = False
          for f in files:
              d = json.load(open(f))
              comps = d.get('components', [])
              assert d.get('bomFormat') == 'CycloneDX', f"{f}: not CycloneDX"
              assert len(comps) > 50, f"{f}: only {len(comps)} components"
              print(f"{f}: {d['bomFormat']} {d.get('specVersion')}, {len(comps)} components")
              for c in comps:
                  if c['name'] == 'rustls':
                      print(f"   rustls {c.get('version')}")
                      assert c.get('version', '0') >= '0.23.45', \
                          f"{f}: rustls {c.get('version')} is below the RUSTSEC-2026-0285 fix"
                      ok = True
          assert ok, "no SBOM named rustls; the graph described is not OmniBridge's"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: out/*.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------- 5 -----
  collect:
    name: SHA256SUMS + provenance
    needs: [bundle, rpm, deb, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Both are needed by attest-build-provenance, and neither is a secret of
      # ours: the identity is GitHub's OIDC token and the transparency log is
      # Sigstore's.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged

      # Per-distribution subdirectories, and that is not cosmetic. All three
      # targets build `omnibridge_0.1.0-1_amd64.deb` — the same filename, three
      # different binaries. MEASURED on the first green run: flattening them
      # into one directory kept whichever was copied last and silently dropped
      # the other two, and SHA256SUMS listed 10 files where 14 were built.
      #
      # The canonical filename is preserved rather than mangled, because that
      # is what `dpkg -i` and an apt repository expect; the directory carries
      # the distinction instead.
      - name: Gather every artifact, keeping the distributions apart
        run: |
          mkdir -p release/fedora44 release/ubuntu2404 release/ubuntu2604 \
                   release/debian13 release/sbom
          cp staged/source-bundle/*.tar.* release/
          cp staged/rpm-fedora44/*.rpm    release/fedora44/
          cp staged/deb-ubuntu2404/*.deb  release/ubuntu2404/
          cp staged/deb-ubuntu2604/*.deb  release/ubuntu2604/
          cp staged/deb-debian13/*.deb    release/debian13/
          cp staged/sbom/*.cdx.json       release/sbom/
          find release -type f | sort

      # A release that quietly ships less than it built is the failure this
      # whole job exists to prevent, so the count is asserted rather than
      # eyeballed.
      - name: Every artifact that was built is present
        run: |
          fail=0
          check() {
            n=$(find "$1" -maxdepth 1 -type f -name "$2" | wc -l)
            if [ "$n" -ne "$3" ]; then
              echo "::error::expected $3 file(s) matching $2 in $1, found $n"
              fail=1
            else
              echo "ok  $1/$2 -> $n"
            fi
          }
          check release            '*.tar.*'    2
          check release/fedora44   '*.rpm'      3
          check release/ubuntu2404 '*.deb'      2
          check release/ubuntu2604 '*.deb'      2
          check release/debian13   '*.deb'      2
          check release/sbom       '*.cdx.json' 3
          # And the three same-named .deb sets must genuinely differ: identical
          # bytes would mean one distribution's build was reused for another.
          a=$(sha256sum release/ubuntu2404/omnibridge_*.deb | cut -d' ' -f1)
          b=$(sha256sum release/ubuntu2604/omnibridge_*.deb | cut -d' ' -f1)
          c=$(sha256sum release/debian13/omnibridge_*.deb   | cut -d' ' -f1)
          if [ "$a" = "$b" ] || [ "$a" = "$c" ] || [ "$b" = "$c" ]; then
            echo "::error::two distributions produced byte-identical packages"
            fail=1
          else
            echo "ok  the three distributions produced three distinct packages"
          fi
          exit "$fail"

      - name: SHA256SUMS
        working-directory: release
        run: |
          # Paths, not bare names, because the same filename occurs in three
          # directories. Sorted, so two runs over the same inputs agree.
          find . -type f ! -name 'SHA256SUMS' -printf '%P\n' | sort \
            | xargs sha256sum > SHA256SUMS
          wc -l < SHA256SUMS
          cat SHA256SUMS

      # ----------------------------------------------------------------
      # Sign SHA256SUMS, when and only when there is a key to sign with.
      # ----------------------------------------------------------------
      # `secrets` cannot be used in a job-level `if`, so presence is decided
      # here and carried as an output. An empty secret is treated as absent:
      # a secret configured to the empty string would otherwise take the
      # signing path and fail deep inside gpg.
      - name: Is a signing key configured?
        id: signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "A signing key is configured; SHA256SUMS will be signed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RELEASE_SIGNING_KEY secret is configured, so SHA256SUMS is NOT signed."
          fi

      - name: Sign SHA256SUMS
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          OMNIBRIDGE_SIGNING_FPR: ${{ vars.RELEASE_SIGNING_FPR }}
        run: |
          set -euo pipefail
          # A keyring of our own, outside the runner's HOME, removed at the end
          # of the step whatever happens.
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          cleanup() { gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"; }
          trap cleanup EXIT

          # Through a pipe, never a file and never an argument: a temporary
          # file holding the key could outlive a failure, and an argument is
          # visible in `ps` to anything else on the runner.
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --batch --with-colons --list-secret-keys \
                 | awk -F: '/^fpr:/ {print $10; exit}')"
          [ -n "$fpr" ] || { echo "::error::the imported key has no usable secret half"; exit 1; }
          echo "imported a signing key: $fpr"

          # If the repository declares which fingerprint is expected, the
          # imported key must be it. A secret rotated to the wrong key would
          # otherwise sign a release with an identity users do not trust.
          if [ -n "${OMNIBRIDGE_SIGNING_FPR:-}" ]; then
            want="$(printf '%s' "$OMNIBRIDGE_SIGNING_FPR" | tr -d '[:space:]' | tr 'a-f' 'A-F')"
            got="$(printf '%s' "$fpr" | tr -d '[:space:]' | tr 'a-f' 'A-F')"
            [ "$want" = "$got" ] || { echo "::error::RELEASE_SIGNING_KEY is $got but vars.RELEASE_SIGNING_FPR says $want"; exit 1; }
            echo "the imported key matches the declared fingerprint"
          else
            echo "::warning::vars.RELEASE_SIGNING_FPR is not set, so the imported key's identity is not cross-checked."
          fi

          ./packaging/release/sign-release.sh --dir release --key "$fpr"

          # Verify the way a user would: against an exported public keyring
          # holding only this key, with the fingerprint pinned.
          gpg --batch --export "$fpr" > "$RUNNER_TEMP/release-pubkey.gpg"
          ./packaging/release/verify-release.sh \
              --dir release \
              --keyring "$RUNNER_TEMP/release-pubkey.gpg" \
              --fingerprint "$fpr"

      # Runs whether or not anything was signed. The release directory is about
      # to be uploaded, and a private key reaching it would be published.
      - name: No signing material may reach the artifacts
        run: |
          set -euo pipefail
          if grep -rlq -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' release 2>/dev/null; then
            echo "::error::private key material is present under release/"
            exit 1
          fi
          if grep -rlq -- '-----BEGIN OPENSSH PRIVATE KEY-----' release 2>/dev/null; then
            echo "::error::an OpenSSH private key is present under release/"
            exit 1
          fi
          # NOT `find ... | grep -q .`. grep -q exits on the first match, find
          # then dies of SIGPIPE, and `pipefail` turns that into "no match" --
          # this guard reporting "no key material" while key material is there.
          # Measured on this call site: 0 misses in 100 runs with one leaked
          # key, and 100 misses in 100 runs with 500 of them. One leaked key is
          # the realistic case and it is caught today, so this is a latent
          # defect rather than a live one -- but it is the exact form AGENTS.md
          # forbids, and the fix is to capture the output and test it.
          keyshaped="$(find release \( -name '*.gpg' -o -name 'secring*' -o -name '*.key' \) -print)"
          if [ -n "$keyshaped" ]; then
            echo "::error::a key-shaped file is present under release/:"
            printf '%s\n' "$keyshaped"
            exit 1
          fi
          echo "ok  no private key material and no key-shaped file under release/"

      - name: Signing status
        run: |
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            echo "SHA256SUMS is signed; SHA256SUMS.asc is part of this release."
            ls -l release/SHA256SUMS.asc
          else
            echo "SHA256SUMS is NOT signed. Signing needs a private key this"
            echo "repository does not have, and a signature produced with an"
            echo "invented key would mean nothing. The path is implemented and"
            echo "waits on a key-custody decision — see"
            echo "docs/audits/release/RELEASE-SIGNING-FOUNDATION-V1.md."
          fi

      # Sigstore-backed, using GitHub's own OIDC identity. It records what was
      # built and from which commit; it is not, and does not pretend to be, a
      # maintainer's signature over the release.
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          # The files, not the directories. `release/*` now matches the
          # per-distribution subdirectories rather than the artifacts inside
          # them, which would attest nothing useful.
          subject-path: |
            release/*.tar.gz
            release/*.tar.xz
            release/SHA256SUMS
            release/*/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.bundle.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## OmniBridge ${{ needs.bundle.outputs.version }}"
            echo
            echo "Built from \`${{ needs.bundle.outputs.rev }}\` — an immutable commit."
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            echo
            echo "SHA256SUMS is unsigned; see the release-CI audit for why."
          } >> "$GITHUB_STEP_SUMMARY"
