# Resource limits are deliberate, not arbitrary.
#
# This is a single-module project: parallel execution buys almost nothing,
# while the Gradle JVM, the Kotlin compile daemon and AGP's workers together
# can easily commit several GiB. On a 16 GiB developer laptop that is also
# running an IDE, the default settings are enough to drive the machine into
# swap. Keep the ceilings explicit so a build is predictable rather than
# occasionally catastrophic.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
