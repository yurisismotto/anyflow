[package]
name = "anyflow-capability-battery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyflow-core = { version = "0.1.0", path = "../../core" }
anyflow-proto = { version = "0.1.0", path = "../../proto" }
prost = "0.14"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
async-trait = "0.1"

[features]
default = []
# Reads the desktop's own battery from UPower over D-Bus. Optional because a
# desktop tower has no battery and should not pull in a D-Bus client.
upower = ["dep:zbus"]

[dependencies.zbus]
version = "5"
optional = true
default-features = false
features = ["tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
