[package]
name = "anyflow-capability-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyflow-core = { version = "0.1.0", path = "../../core" }
anyflow-proto = { version = "0.1.0", path = "../../proto" }
prost = "0.14"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt"] }
tracing = "0.1"
async-trait = "0.1"
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1.8.2"
rand = "0.9.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
