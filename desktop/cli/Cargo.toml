[package]
name = "fedroid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "fedroid"
path = "src/main.rs"

[dependencies]
fedroid-core = { version = "0.1.0", path = "../core" }
fedroid-daemon = { version = "0.1.0", path = "../daemon", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "signal"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
