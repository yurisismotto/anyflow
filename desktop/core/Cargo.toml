[package]
name = "fedroid-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
data-encoding = "2.11.1"
fedroid-proto = { version = "0.1.0", path = "../proto" }
hmac = "0.12.1"
prost = "0.14.3"
rand = "0.9.5"
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tracing = "0.1.44"
x509-parser = "0.18.1"
zeroize = "1.8.2"

[dev-dependencies]
data-encoding = "2.11.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
x509-parser = "0.18.1"
