<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="AnyFlow">
  <title>AnyFlow wordmark</title>
  <!--
    Set in live text rather than outlines, deliberately. Inter is the brand
    direction but is not bundled here; the stack falls through to the
    platform's own UI face, which is what the apps render too. Outlining the
    word would freeze a substitute face into the asset and make the logo
    disagree with the product. See docs/design/BRAND.md, "Typography".
  -->
  <text x="0" y="46" font-family="Inter, Cantarell, 'Adwaita Sans', 'Noto Sans', system-ui, sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="#0F172A">AnyFlow</text>
</svg>
