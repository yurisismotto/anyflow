syntax = "proto3";

package anyflow.v1.capabilities;

// Java options are for the Android build; prost ignores them. Both sides
// compile these exact files, so the wire format cannot drift.
option java_package = "io.github.yurisismotto.anyflow.proto.capabilities";
option java_outer_classname = "ClipboardV1Proto";
option java_multiple_files = true;

// Capability id: "clipboard.v1"
//
// Carried as the opaque `payload` of a CapabilityMessage on the ordinary
// control session. There is no second socket, no second listener and no data
// stream: clipboard text is control-plane data and stays inside the 64 KiB
// frame, which is why `MAX_CLIPBOARD_TEXT_BYTES` is set well below
// `MAX_FRAME_LEN` (see CLIPBOARD.md).
//
// TEXT ONLY. There is deliberately no field here for an image, a file, a URI
// or HTML. A clipboard that can carry a file is a file transfer with a worse
// consent story, and `files.v1` already exists for that.

// ---------------------------------------------------------------------------
// An update
// ---------------------------------------------------------------------------

// One clipboard event, offered by the device where the copy happened.
//
// Receiving this message is not the same as applying it. The receiver checks,
// in order: the `clipboard.v1` grant, its own per-peer receive policy, the
// size, the encoding, the hash, and its de-duplication cache — and only then
// decides whether the text reaches the system clipboard at all.
message ClipboardUpdate {
  // Exactly 16 cryptographically random bytes, generated per clipboard event.
  //
  // NOT the envelope's `message_id`, for the same reason `files.v1` does not
  // reuse it for `transfer_id`: a message id is meaningful for one frame and
  // is aged out by the session's replay window, while a clipboard event id
  // has to stay meaningful for a de-duplication cache that outlives both the
  // frame and, potentially, the connection. Two ids with different lifetimes
  // must not be the same field.
  bytes event_id = 1;

  // Device id of the device where the copy actually happened.
  //
  // Load-bearing for exactly one thing: it is how a receiver can tell a
  // first-hand clipboard event from one that has already travelled. It is
  // NOT identity and is never an authorization input — the pinned TLS
  // identity of the sending peer is. A peer that lies here gains nothing it
  // could not get by omitting the field.
  string origin_device_id = 2;

  // The clipboard text, UTF-8.
  //
  // Bounded by the capability, not by the transport: see
  // `MAX_CLIPBOARD_TEXT_BYTES`. Content larger than that is rejected with
  // TOO_LARGE and never truncated — a silently shortened password is worse
  // than a refused one.
  string text_utf8 = 3;

  // SHA-256 over the UTF-8 bytes of `text_utf8`, exactly 32 bytes.
  //
  // For de-duplication, loop suppression and diagnostics that must not log
  // the content. It is NOT authentication: TLS 1.3 with pinned identities
  // and the capability grant are what make this message trustworthy, and a
  // matching hash from an unauthorized peer still gets nowhere.
  bytes content_hash = 4;

  // The sender's belief that this clip is sensitive — a password-manager
  // copy, a one-time code. On Android this comes from
  // `ClipDescription.EXTRA_IS_SENSITIVE`.
  //
  // A HINT, in both directions. It is not an ACL and not a cryptographic
  // property: a receiver uses it to decide how to *present* the clip (and
  // whether to hand it to the platform marked sensitive), never to decide
  // whether the peer was allowed to send it.
  bool sensitive_hint = 5;

  // Sender's wall clock. Informational only, exactly as in the Envelope:
  // never an input to an authorization, expiry, ordering or de-duplication
  // decision. Ordering within a session comes from the protocol.
  int64 timestamp_unix_ms = 6;
}

// ---------------------------------------------------------------------------
// What happened to it
// ---------------------------------------------------------------------------

// The receiver's verdict on one update.
//
// Every value here is safe to send to a peer: it says what happened in a
// vocabulary the sender can act on, and nothing about the receiver's local
// state. No exception text, no path, and never any part of the clipboard
// content — including the content the receiver already held.
enum ClipboardOutcome {
  CLIPBOARD_OUTCOME_UNSPECIFIED = 0;
  // Written to the receiver's system clipboard.
  CLIPBOARD_OUTCOME_APPLIED = 1;
  // Accepted, but the receiver's policy needs a human to apply it. The
  // clip is held in memory, briefly, and never written to disk.
  CLIPBOARD_OUTCOME_PENDING_USER = 2;
  // This `event_id` was already handled. Idempotent: nothing happened twice.
  CLIPBOARD_OUTCOME_DUPLICATE = 3;
  // The peer has no `clipboard.v1` grant here.
  CLIPBOARD_OUTCOME_NOT_AUTHORIZED = 4;
  // Granted, but the receiver's per-peer policy does not accept clipboard
  // from this device in this direction.
  CLIPBOARD_OUTCOME_REJECTED_POLICY = 5;
  // The receiver declines clips marked sensitive.
  CLIPBOARD_OUTCOME_REJECTED_SENSITIVE = 6;
  // Larger than the receiver's ceiling. Use `files.v1` for bulk content.
  CLIPBOARD_OUTCOME_TOO_LARGE = 7;
  // Not valid UTF-8, malformed, or otherwise unusable as text.
  CLIPBOARD_OUTCOME_INVALID_TEXT = 8;
  // The receiver's clipboard backend refused or was unavailable.
  CLIPBOARD_OUTCOME_FAILED = 9;
}

// Sent by the receiver for every well-formed update it can attribute to an
// `event_id`. The sender needs to know the destination of the operation; it
// gets exactly that and nothing more.
message ClipboardResult {
  // Echoes the update's `event_id`.
  bytes event_id = 1;
  ClipboardOutcome outcome = 2;
}

// The `clipboard.v1` capability payload. Carried inside
// CapabilityMessage.payload, which the transport treats as opaque bytes.
message ClipboardControl {
  oneof body {
    ClipboardUpdate update = 1;
    ClipboardResult result = 2;
  }
}
