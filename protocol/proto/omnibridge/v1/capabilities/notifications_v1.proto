syntax = "proto3";

package omnibridge.v1.capabilities;

// Java options are for the Android build; prost ignores them. Both sides
// compile these exact files, so the wire format cannot drift.
option java_package = "io.github.yurisismotto.omnibridge.proto.capabilities";
option java_outer_classname = "NotificationsV1Proto";
option java_multiple_files = true;

// Capability id: "notifications.v1"
//
// Carried as the opaque `payload` of a CapabilityMessage on the ordinary
// control session. There is no second socket and no data stream: a
// notification is a few hundred bytes of text, so the `files.v1` split would
// buy nothing. The ceiling that keeps that true is
// `MAX_NOTIFICATION_BYTES` (8 KiB), set well below `MAX_FRAME_LEN` (64 KiB).
//
// CONTROL-PLANE TEXT ONLY. There is deliberately no field here for an icon,
// an image, a `PendingIntent`, a `RemoteViews`, a `RemoteInput`, a
// notification action, a reply, a serialized platform `Notification` or
// `Bundle`, or any free `bytes` blob. This is the line between *mirroring* a
// notification and *remotely controlling* the device that raised it, and the
// line is drawn by the absence of a field rather than by a check that could
// be inverted later. See ADR-0015 §1 clauses 11-13 and
// docs/research/notifications-v1/03 §T-N09.
//
// Nothing here is a history: the only state this schema can express is what
// is *currently active* on the source. See ADR-0015 §1 clause 8 and
// docs/architecture/NOTIFICATIONS.md.

// ---------------------------------------------------------------------------
// Roles — asymmetry is announced, never assumed
// ---------------------------------------------------------------------------

// What a peer claims it can do for `notifications.v1` *on this connection*.
//
// A peer must never infer that every platform supports both directions:
// Android sources but does not sink in v1, Linux sinks but does not source,
// and macOS/iOS can sink but barely source. Roles say which half of the
// capability a peer actually implements right now.
//
// A role is a peer's claim about *itself*. It is never an authorization
// input: the pinned TLS identity and the local grant decide what is allowed.
// Roles only stop a sender wasting content on a device that would drop it.
enum NotificationRole {
  NOTIFICATION_ROLE_UNSPECIFIED = 0;
  // I can observe this device's own notifications and mirror them to you.
  NOTIFICATION_ROLE_SOURCE = 1;
  // I can display notifications you send me.
  NOTIFICATION_ROLE_SINK = 2;
  // I will act on your DismissRequest for notifications I sourced.
  NOTIFICATION_ROLE_DISMISS_TARGET = 3;
  // I will tell you when a human dismissed a mirror I displayed.
  NOTIFICATION_ROLE_DISMISS_REPORTER = 4;
}

// A peer's current role set, announced first and re-announced whenever it
// changes.
//
// Roles are NOT in `HELLO` and that is deliberate (ADR-0017). The user can
// revoke Android notification access mid-session, which fires
// `onListenerDisconnected()`; the phone has to be able to say "I am no longer
// a SOURCE" *now*, without a reconnect, and without dropping the whole
// capability — it should still accept dismissals it can still honour.
// `HELLO` is sent once, so it cannot express that.
//
// ABSENT ROLES MEAN NO ROLES. A peer that never sends this message gets
// nothing sent to it and has nothing accepted from it. That is the
// fail-closed default, and it is what lets a minimal or older implementation
// interoperate harmlessly.
message NotificationRoles {
  // The complete set, not a delta. An empty list is meaningful: it means
  // "I currently have no notification role", which is exactly what an Android
  // device says the moment the user revokes notification access.
  //
  // Unknown values are ignored rather than assumed granted, so a future role
  // cannot be inferred into existence by an older peer.
  repeated NotificationRole roles = 1;

  // Monotonic per connection, starting at 1.
  //
  // A receiver ignores a roles message whose epoch is not strictly greater
  // than the last it accepted, so a reordered, replayed or duplicated
  // announcement cannot re-widen a set that has already narrowed. Narrowing
  // is the safety-critical direction and must never be undone by a stale
  // message. Epoch 0 is "unset" and is refused.
  uint32 epoch = 2;
}

// ---------------------------------------------------------------------------
// The event model
// ---------------------------------------------------------------------------

// How loudly the source would present this. Presentation only; never a
// security boundary.
enum NotificationImportance {
  NOTIFICATION_IMPORTANCE_UNSPECIFIED = 0;
  NOTIFICATION_IMPORTANCE_LOW    = 1;  // Android MIN(1), LOW(2)
  NOTIFICATION_IMPORTANCE_NORMAL = 2;  // Android DEFAULT(3)
  NOTIFICATION_IMPORTANCE_HIGH   = 3;  // Android HIGH(4), MAX(5)
  // Android IMPORTANCE_NONE(0) has no wire value on purpose: a notification
  // the phone does not show its own owner must not become a desktop banner.
}

// The app's own declaration of how it wants to appear on a lock screen.
//
// The richest sensitivity signal the platform offers, and still A HINT, NOT
// AN ACL — exactly as `ClipboardUpdate.sensitive_hint` is. A PUBLIC
// notification from an ungranted peer is still refused; a SECRET one from a
// granted peer is still governed by local policy.
//
// OmniBridge never tries to detect sensitive content itself: no OTP regex, no
// keyword list, no "looks like a bank" heuristic. On the certification
// hardware the platform's own OTP redaction did not fire at all
// (POC-NOTIF-01), so no rule here may assume the platform protects us.
enum NotificationPrivacy {
  // Treated as PRIVATE. An unset or unknown value must never decay to the
  // most permissive one.
  NOTIFICATION_PRIVACY_UNSPECIFIED = 0;
  NOTIFICATION_PRIVACY_PUBLIC  = 1;  // Android VISIBILITY_PUBLIC  ( 1)
  NOTIFICATION_PRIVACY_PRIVATE = 2;  // Android VISIBILITY_PRIVATE ( 0)
  // Never mirrored at all, at the source, unconditionally. Not a default a
  // settings screen can flip.
  NOTIFICATION_PRIVACY_SECRET  = 3;  // Android VISIBILITY_SECRET  (-1)
}

// A deliberately lossy, portable projection of Android's 24 categories.
//
// Presentation and coalescing ONLY — grouping, an icon, a rate-limit class.
// Never a security boundary: an app chooses its own category, so
// `CATEGORY_SYSTEM` is a claim by an arbitrary application and nothing more.
enum NotificationCategory {
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;
  NOTIFICATION_CATEGORY_MESSAGE   = 1;  // MESSAGE, EMAIL, SOCIAL
  NOTIFICATION_CATEGORY_CALL      = 2;  // CALL, MISSED_CALL, VOICEMAIL
  NOTIFICATION_CATEGORY_ALARM     = 3;  // ALARM, REMINDER, EVENT
  NOTIFICATION_CATEGORY_PROGRESS  = 4;  // PROGRESS
  NOTIFICATION_CATEGORY_TRANSPORT = 5;  // TRANSPORT (media)
  NOTIFICATION_CATEGORY_SYSTEM    = 6;  // SYSTEM, SERVICE, ERROR
  NOTIFICATION_CATEGORY_OTHER     = 7;
}

// A progress bar, present only when the source notification actually has one.
//
// Carried because it is semantically portable (a Windows toast has a real
// progress bar) and because it tells the sink *this identity will update
// rapidly*, which is a rate-limiting input. A sink that cannot render a bar
// must NOT synthesize "47%" into the body: mutating the app's own text to
// simulate a feature the desktop lacks corrupts user content.
message Progress {
  uint32 current       = 1;
  uint32 max           = 2;
  bool   indeterminate = 3;
}

// The current state of one notification identity.
//
// POSTED AND UPDATED ARE THE SAME MESSAGE. No platform OmniBridge targets has a
// separate "update" operation: `onNotificationPosted` fires for both and the
// key is identical; freedesktop `Notify` with `replaces_id` is the same
// method; re-adding a macOS request with the same identifier replaces it.
// A protocol that invented the distinction would make both ends keep the same
// state purely to produce and discard a field that changes nothing.
//
// So this is an idempotent upsert: "this is the current state of this
// notification identity". The sink creates or replaces accordingly, which
// also makes reconnect resynchronisation free — a snapshot is just upserts.
message NotificationUpsert {
  // Stable remote identity. EXACTLY 16 bytes, never truncated, never derived
  // from content.
  //
  // Derived at the source as
  //   HMAC-SHA256(device_notification_secret,
  //               "omnibridge/notifications.v1/id/v1" || len32(key) || key)[0..16]
  // where `key` is the platform's own notification key. The RAW ANDROID KEY
  // IS NEVER TRANSMITTED: it is `userId|pkg|id|tag|uid` and would ship a
  // profile id and an install-specific uid to a desktop that never needed
  // either. See ADR-0016.
  //
  // The derivation belongs to the source platform adapter, because it needs
  // that device's secret. This schema defines only the type, the width and
  // the validation.
  bytes  notification_id = 1;

  // Device where the notification actually exists.
  //
  // NOT identity, and never an authorization input — the pinned TLS peer is.
  // Same rule and same reason as `ClipboardUpdate.origin_device_id`. A sink
  // keys its mirror table on (peer_fingerprint, notification_id), so a peer
  // that lies here gains nothing: it can only ever address its own mirrors.
  string origin_device_id = 2;

  // Reverse-DNS application identifier, e.g. "com.example.chat". ≤ 255 bytes.
  //
  // Attacker-controlled: sanitized and length-capped before display. This is
  // the one identifier the derived `notification_id` deliberately does NOT
  // hide — the sink must be able to say which app a notification came from,
  // and to apply per-app rules.
  string app_id = 3;
  // Human-readable application name, resolved at the source because only the
  // source has a package database. ≤ 128 bytes. Also attacker-controlled.
  string app_label = 4;

  string title = 5;   // ≤ 512 bytes, may be empty
  string body  = 6;   // ≤ 4096 bytes, may be empty

  // Source's wall clock when the notification was posted.
  //
  // Informational only, exactly as in the Envelope: never an input to
  // authorization, ordering, expiry or de-duplication.
  int64  posted_at_unix_ms = 7;

  NotificationImportance importance = 8;
  NotificationPrivacy    privacy    = 9;
  NotificationCategory   category   = 10;

  // Absent unless the source notification actually has a progress bar.
  Progress progress = 11;

  // FLAG_ONGOING_EVENT on Android: a persistent, usually non-dismissible
  // notification — media, navigation, a foreground service.
  bool ongoing = 12;
  // Whether a human can dismiss this at the SOURCE at all (Android
  // `isClearable()`). False means a DismissRequest for it will be refused,
  // and the sink should not offer dismissal sync for it.
  bool dismissible = 13;

  // Opaque 8-byte digest of the source's group key:
  //   SHA-256("omnibridge/notifications.v1/group/v1" || len32(gk) || gk)[0..8]
  // Groups mirrored notifications without revealing the platform group
  // string, which embeds the package and app-internal identifiers.
  // Absent = ungrouped. Exactly 8 bytes when present.
  bytes group_id = 14;
  // This notification is the summary of its group rather than a member.
  bool group_summary = 15;

  // The notification belongs to a secondary profile (an Android work
  // profile). A boolean, not the numeric user id: the semantic is portable,
  // the number is an Android implementation detail and a fingerprinting
  // surface.
  bool secondary_profile = 16;

  // Set when the SOURCE reduced this notification before sending it: a
  // locked-device policy, a per-app "app name only" rule, or platform
  // redaction. The sink shows it as reduced rather than pretending it is
  // complete.
  //
  // NOT set for a length truncation — that is a limit, not a privacy
  // reduction.
  bool redacted = 17;

  // SHA-256 over the canonical encoding of the semantic fields. Exactly 32
  // bytes, or absent.
  //
  // For de-duplication, loop detection, and diagnostics that must not log
  // content. NOT authentication: TLS 1.3 with pinned identities and the
  // capability grant are what make this message trustworthy. Absent is
  // accepted; present-and-mismatched is INVALID.
  //
  // CONTENT IS NEVER IDENTITY. Two notifications that read the same are two
  // notifications; one whose body changed is still the same notification.
  bytes content_hash = 18;
}

// This notification is gone. Remove the mirror.
//
// There is deliberately no reason code. All 23 Android removal reasons mean
// the same thing to a mirror — *it is gone* — and shipping the reason would
// leak facts about the user's device (REASON_PACKAGE_BANNED, REASON_CLEAR_DATA)
// while inviting an implementation to treat some removals as "soft".
// REASON_LOCKDOWN's own javadoc requires listeners to remove cancelled
// notifications "to prevent data leaking", and there is no reason code for
// which the correct action is to keep showing it.
//
// The reason IS used at the source, locally, for echo suppression.
message NotificationRemove {
  bytes  notification_id  = 1;
  string origin_device_id = 2;
}

// Please dismiss this notification at its source.
//
// THIS IS THE ONLY MESSAGE THAT TRAVELS SINK -> SOURCE AND CAUSES AN EFFECT
// ON THE SOURCE DEVICE, and it maps to exactly one platform call:
// `cancelNotification(key)`.
//
// It carries no action index, no intent, no payload, no free text and no
// reply. There is nothing here that could be widened into remote action
// execution, because there is no field to widen — and that is enforced by the
// shape of this message, not by a check. Adding one would be a change to
// ADR-0015 §1 and ADR-0016, not an implementation detail.
//
// Idempotent: dismissing twice, or dismissing something already gone, answers
// UNKNOWN_NOTIFICATION rather than failing. A dismiss for a notification the
// receiver never sourced is refused; a peer cannot dismiss a third device's
// notification through us.
message DismissRequest {
  bytes  notification_id  = 1;
  // Which device's notification this refers to. The receiver additionally
  // requires that it is itself the origin.
  string origin_device_id = 2;
}

// ---------------------------------------------------------------------------
// What happened to it
// ---------------------------------------------------------------------------

// The receiver's verdict on one message.
//
// Every value here is safe to send to a peer: it says what happened in a
// vocabulary the sender can act on, and nothing about the receiver's local
// state. No exception text, no D-Bus error, no app list, and never any part
// of a notification's content.
enum NotificationOutcome {
  NOTIFICATION_OUTCOME_UNSPECIFIED = 0;
  // Created or replaced a mirror.
  NOTIFICATION_OUTCOME_DISPLAYED = 1;
  // Mirror closed, or the source cancelled.
  NOTIFICATION_OUTCOME_REMOVED = 2;
  // Already handled; nothing happened twice. An answer, not an error.
  NOTIFICATION_OUTCOME_DUPLICATE = 3;
  // The peer has no `notifications.v1` grant here.
  NOTIFICATION_OUTCOME_NOT_AUTHORIZED = 4;
  // Granted, but local policy says no.
  NOTIFICATION_OUTCOME_REJECTED_POLICY = 5;
  // I never claimed the role this message assumes.
  NOTIFICATION_OUTCOME_REJECTED_ROLE = 6;
  // This app is not on the list shared with this peer.
  NOTIFICATION_OUTCOME_REJECTED_FILTER = 7;
  // The source refuses: the notification is ongoing or not clearable.
  NOTIFICATION_OUTCOME_NOT_DISMISSIBLE = 8;
  // No such id; already gone. An answer, not an error — it is what makes
  // dismissal and removal idempotent.
  NOTIFICATION_OUTCOME_UNKNOWN_NOTIFICATION = 9;
  // Past a field limit or the whole-message ceiling. NEVER truncated by the
  // receiver: at that point the message is already malformed by our own
  // rules, and a receiver that repairs malformed input is one whose limits
  // are advisory.
  NOTIFICATION_OUTCOME_TOO_LARGE = 10;
  // Malformed: bad UTF-8, a NUL, a bad-width identifier, a hash mismatch.
  NOTIFICATION_OUTCOME_INVALID = 11;
  NOTIFICATION_OUTCOME_RATE_LIMITED = 12;
  // No notification server, or no bound listener.
  NOTIFICATION_OUTCOME_UNAVAILABLE = 13;
  // The backend refused.
  NOTIFICATION_OUTCOME_FAILED = 14;
}

message NotificationResult {
  bytes notification_id = 1;
  NotificationOutcome outcome = 2;
}

// ---------------------------------------------------------------------------
// Snapshot framing
// ---------------------------------------------------------------------------

// Brackets an ACTIVE-STATE snapshot: BEGIN, the current active items as
// ordinary upserts, END.
//
// Without an END marker the sink cannot tell "the source has finished telling
// me what is active" from "the source has gone quiet", and therefore cannot
// safely remove the mirrors that were not mentioned.
//
// AN ACTIVE-STATE SNAPSHOT IS NOT A HISTORY. It contains only what is in the
// source's shade at the instant it is built — things the user can see by
// picking up their phone — it is discarded as soon as it is applied, and it
// is never written to disk on either side. Notification history is not a
// feature deferred for time; it is one this design forbids.
//
// The snapshot passes through every filter a live notification does. It is a
// reconciliation mechanism, not a privileged path: it grants a peer no
// authority it does not already have through ordinary upserts.
//
// The sink-local timers that bound a snapshot (an abandon timeout, a
// reconnect grace, a per-peer mirror ceiling) are IMPLEMENTATION TUNABLES,
// not protocol constants: they are never negotiated, never on the wire, and
// changing them cannot break interoperability. Only the bracketing and the
// remove-what-is-not-named rule are protocol.
message SyncMarker {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_BEGIN = 1;
    PHASE_END   = 2;
  }
  // Exactly 16 CSPRNG bytes, one per snapshot. An END whose id does not match
  // the open BEGIN is refused, so a stale or interleaved snapshot cannot
  // silently become authoritative.
  bytes sync_id = 1;
  Phase phase   = 2;
}

// ---------------------------------------------------------------------------
// The envelope of the capability
// ---------------------------------------------------------------------------

// The `notifications.v1` capability payload. Carried inside
// CapabilityMessage.payload, which the transport treats as opaque bytes.
//
// Six bodies, and no seventh. In particular there is no "action" body, no
// "reply" body, no "invoke" body and no generic escape hatch.
message NotificationControl {
  oneof body {
    NotificationRoles  roles   = 1;
    NotificationUpsert upsert  = 2;
    NotificationRemove remove  = 3;
    DismissRequest     dismiss = 4;
    NotificationResult result  = 5;
    SyncMarker         sync    = 6;
  }
}
